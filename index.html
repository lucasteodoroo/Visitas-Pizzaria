<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0b6e4f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Senhor Caixa – Visitas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3f4f6;color:#111;font-size:16px}
header{background:#0b6e4f;color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:17px}header small{display:block;opacity:.85;font-size:12px}
.hbtn{background:#fff;color:#0b6e4f;border:0;border-radius:8px;padding:9px 12px;font-weight:700;font-size:14px}
#tabs{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:1000}
#tabs button{flex:1;border:0;background:none;padding:10px 2px;font-size:14px;font-weight:600;color:#555;border-bottom:3px solid transparent}
#tabs button.on{color:#0b6e4f;border-bottom-color:#0b6e4f}#tabs small{display:block;font-weight:400;font-size:11px}
#map{height:36vh;min-height:210px;max-height:330px;background:#e5e7eb}
#next{margin:10px;padding:12px;background:#fff;border-radius:12px;border-left:6px solid #0b6e4f;box-shadow:0 1px 3px #0002}
#next .t{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.04em}#next .n{font-size:18px;font-weight:700;margin:2px 0}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{flex:1;min-width:92px;text-align:center;text-decoration:none;border:1px solid #cbd5e1;background:#fff;color:#111;border-radius:10px;padding:11px 8px;font-size:15px;font-weight:600}
.btn.pri{background:#0b6e4f;border-color:#0b6e4f;color:#fff}.btn.nav{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.btn.dng{color:#b91c1c;border-color:#fca5a5}
.card{margin:8px 10px;padding:10px;background:#fff;border-radius:12px;box-shadow:0 1px 3px #0002}
.card .top{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;background:#64748b}
.cli{background:#2563eb!important}.ok{background:#16a34a!important}.volta{background:#d97706!important}.no{background:#b91c1c!important}
.card b{font-size:16px;display:block}.card .sub{font-size:13px;color:#555}
.badge{display:inline-block;margin-top:4px;font-size:12px;padding:2px 8px;border-radius:99px;color:#fff;background:#64748b}
#sheet{position:fixed;inset:0;background:#f3f4f6;z-index:5000;display:none;flex-direction:column}#sheet.on{display:flex}
#sheet .sh{background:#0b6e4f;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#sheet .sh b{font-size:16px;line-height:1.2}#sheet .sh button{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:0 6px}
#sb{overflow:auto;padding:10px 10px 90px;flex:1}
.sec{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.sec h3{margin:0 0 8px;font-size:13px;color:#0b6e4f;text-transform:uppercase;letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #f1f1f1;font-size:15px}.kv:last-child{border:0}.kv span:first-child{color:#666;min-width:0;overflow-wrap:anywhere}.kv span:last-child{text-align:right;font-weight:600;max-width:62%;overflow-wrap:anywhere}
.tip{background:#ecfdf5;border-left:4px solid #0b6e4f;padding:9px 10px;border-radius:6px;font-size:15px;margin-top:6px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=password],input[type=tel],input[type=number],input[type=date],textarea,select{width:100%;padding:11px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-family:inherit}
textarea{min-height:80px}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.pg span{display:block;font-size:13px;color:#555;margin-bottom:3px}.pg input{padding:9px!important}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:99px;padding:9px 13px;font-size:15px;color:#111}
.chip.on{background:#0b6e4f;border-color:#0b6e4f;color:#fff}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px;display:flex;gap:8px;z-index:5001}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:9999;display:none}
#lock{position:fixed;inset:0;background:#0b6e4f;z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px}#lform{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:340px}#lform b{font-size:18px}#lform p{font-size:14px;color:#555}#lform input{margin-bottom:10px}#lform .btn{width:100%}#lmsg{color:#b91c1c!important;min-height:18px;margin:8px 0 0}
.muted{color:#666;font-size:13px}a{color:#1d4ed8}
.pin{border:2px solid #fff;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;color:#fff;font:700 13px system-ui;box-shadow:0 1px 4px #0007;background:#64748b}
</style></head><body>

const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n||n===0)?Number(n).toLocaleString('pt-BR'):'–';
let KEY='',ST={};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
let day=0,me=null;
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2200)};
const RES=[['Já é cliente Senhor Caixa','cli'],['Conversei com o decisor','ok'],['Conversei com funcionário','ok'],['Decisor ausente – voltar','volta'],['Estava fechado – voltar','volta'],['Não quis atender','no'],['Não existe / não é pizzaria','no']];
const cls=id=>{const r=ST[id]&&ST[id].resultado;const f=RES.find(x=>x[0]===r);return f?f[1]:(ST[id]?'ok':'')};
const lbl=id=>ST[id]?(ST[id].resultado||'Registrada'):'Pendente';
const dist=(a,b)=>{const R=6371,r=Math.PI/180,dp=(b[0]-a[0])*r,dl=(b[1]-a[1])*r;const h=Math.sin(dp/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const navUrl=s=>'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(s.end||(s.lat+','+s.lon));
const placeUrl=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.nome+', '+s.end);
const dayUrl=d=>{const st=d.stops.filter(s=>!ST[s.id]);const a=(st.length?st:d.stops).map(s=>s.end||(s.lat+','+s.lon));
 return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(a[a.length-1])+(a.length>1?'&waypoints='+encodeURIComponent(a.slice(0,-1).join('|')):'')};
const find=id=>{for(const d of DATA.dias)for(const s of d.stops)if(s.id===id)return[s,d];return[]};

/* mapa */
let map=null,grp=null,meMk=null;
try{map=L.map('map',{zoomControl:false});
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri, © OpenStreetMap'}).addTo(map);
 L.control.zoom({position:'bottomright'}).addTo(map);grp=L.layerGroup().addTo(map);}catch(e){map=null;$('#map').innerHTML='<p class="muted" style="padding:14px">Mapa indisponível sem internet. A lista e os botões "Navegar" funcionam normalmente.</p>'}
function drawMap(fit){if(!map)return;grp.clearLayers();const d=DATA.dias[day];const pts=d.stops.map(s=>[s.lat,s.lon]);
 L.polyline(pts,{color:'#0b6e4f',weight:3,opacity:.6,dashArray:'6 6'}).addTo(grp);
 d.stops.forEach(s=>{L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',html:`<div class="pin ${cls(s.id)}">${s.ordem}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).on('click',()=>openFicha(s.id)).addTo(grp)});
 if(fit)map.fitBounds(pts,{padding:[30,30]});}
function gps(){if(!navigator.geolocation)return;try{navigator.geolocation.watchPosition(p=>{me=[p.coords.latitude,p.coords.longitude];
 if(map){if(!meMk)meMk=L.circleMarker(me,{radius:8,color:'#fff',weight:3,fillColor:'#1d4ed8',fillOpacity:1}).addTo(map);else meMk.setLatLng(me);}renderNext();},()=>{}, {enableHighAccuracy:true,maximumAge:15000,timeout:20000})}catch(e){}}

/* lista */
function renderTabs(){$('#tabs').innerHTML=DATA.dias.map((d,i)=>{const n=d.stops.filter(s=>ST[s.id]).length;return `<button data-i="${i}" class="${i===day?'on':''}">${esc(d.curto)}<small>${n}/${d.stops.length}</small></button>`}).join('')}
function renderNext(){const d=DATA.dias[day];const s=d.stops.find(x=>!ST[x.id]);const el=$('#next');
 if(!s){el.innerHTML=`<div class="t">${esc(d.nome)}</div><div class="n">Todas as visitas do dia registradas ✔</div><div class="row"><button class="btn pri" data-a="env">Enviar relatório</button></div>`;return}
 const km=me?' · '+dist(me,[s.lat,s.lon]).toLocaleString('pt-BR',{maximumFractionDigits:1})+' km daqui':'';
 el.innerHTML=`<div class="t">Próxima parada · ${esc(d.nome)}</div><div class="n">${s.ordem}. ${esc(s.nome)}</div><div class="muted">${esc(s.bairro)}${s.mun&&s.mun!=='São Paulo'?' – '+esc(s.mun):''}${km}</div>
 <div class="row"><a class="btn nav" href="${navUrl(s)}" target="_blank" rel="noopener">▶ Navegar (GPS)</a><button class="btn" data-a="ficha" data-id="${s.id}">Ficha</button><button class="btn pri" data-a="form" data-id="${s.id}">Registrar</button></div>
 <div class="row"><a class="btn" href="${dayUrl(d)}" target="_blank" rel="noopener">Rota completa do dia no Google Maps</a></div>`}
function renderList(){const d=DATA.dias[day];$('#list').innerHTML=d.stops.map(s=>`<div class="card"><div class="top"><div class="num ${cls(s.id)}">${s.ordem}</div><div style="flex:1">
 <b>${esc(s.nome)}</b><div class="sub">${esc(s.bairro)}${s.mun&&s.mun!=='São Paulo'?' – '+esc(s.mun):''} · ★ ${s.nota||'–'} (${fmt(s.av)})</div><span class="badge ${cls(s.id)}">${esc(lbl(s.id))}</span></div></div>
 <div class="row"><a class="btn nav" href="${navUrl(s)}" target="_blank" rel="noopener">Navegar</a><button class="btn" data-a="ficha" data-id="${s.id}">Ficha</button><button class="btn pri" data-a="form" data-id="${s.id}">${ST[s.id]?'Editar':'Registrar'}</button></div></div>`).join('')+'<p class="muted" style="text-align:center;padding:8px 14px 30px">Os registros ficam salvos neste celular até você enviar o relatório.</p>'}
function render(fit){renderTabs();renderNext();renderList();drawMap(fit)}

/* folha (ficha / formulário / envio) */
const openSheet=(t,body,foot)=>{$('#st').textContent=t;$('#sb').innerHTML=body;$('#sf').innerHTML=foot||'';$('#sheet').classList.add('on');$('#sb').scrollTop=0};
const closeSheet=()=>$('#sheet').classList.remove('on');
const kv=(k,v)=>(v||v===0)&&v!=='–'?`<div class="kv"><span>${k}</span><span>${v}</span></div>`:'';
function openFicha(id){const[s]=find(id);if(!s)return;const tel=t=>t?`<a href="tel:${t.replace(/\D/g,'')}">${esc(t)}</a>`:'';
 const vol=s.av>=1000?'Alto':s.av>=200?'Médio':s.av>=30?'Baixo':'Muito baixo';
 const tips=[];
 if(s.faixa==='Alta')tips.push('Entorno de <b>renda alta</b>: apresente a <b>caixa personalizada</b> (logo, papelão mais firme, boa impressão).');
 else if(s.faixa==='Média-alta')tips.push('Entorno de renda média-alta: mostre as duas linhas, <b>padrão e personalizada</b>.');
 else if(s.faixa)tips.push('Região mais sensível a preço: foque em <b>preço por cento</b>, prazo e regularidade de entrega.');
 if(s.av>=1000)tips.push('Movimento <b>alto</b> pelo Google: provável compra grande e recorrente. Tente falar com o dono ou o comprador.');
 if(s.rede)tips.push('Parece fazer parte de uma <b>rede</b>: pergunte quem centraliza a compra de embalagens.');
 if(s.conc&&s.conc[0]&&s.conc[0].km<=1.5)tips.push('Há fornecedor de embalagem a '+s.conc[0].km.toLocaleString('pt-BR')+' km: pergunte de quem compram e o que falta no atendimento atual.');
 const r=ST[id];
 openSheet(s.nome,`
 ${r?`<div class="sec"><h3>Última visita registrada</h3>${kv('Resultado',esc(r.resultado))}${kv('Quando',new Date(r.quando).toLocaleString('pt-BR'))}${kv('Fornecedor',esc(r.fornecedor))}${kv('Próximo passo',esc(r.proximo))}</div>`:''}
 <div class="sec"><h3>Contato</h3><div style="font-size:15px;margin-bottom:6px">${esc(s.end)}</div>
 ${kv('Telefone',tel(s.tel))}${kv('Telefone 2',tel(s.tel2))}${kv('E-mail cadastrado',esc(s.email))}
 ${s.link?kv(s.link.includes('instagram')?'Instagram':'Site',`<a href="${esc(s.link)}" target="_blank" rel="noopener">abrir</a>`):''}
 ${kv('Google Maps',`<a href="${placeUrl(s)}" target="_blank" rel="noopener">ver fotos e horário</a>`)}</div>
 <div class="sec"><h3>Perfil da pizzaria</h3>${kv('Nota no Google',s.nota?s.nota+' ★':'')}${kv('Avaliações',fmt(s.av))}${kv('Movimento estimado',vol)}
 ${kv('Tipo',esc(s.ativ))}${kv('Tempo de atividade',s.anos?fmt(s.anos)+' anos':'')}${kv('Porte',esc(s.porte))}${kv('Matriz/filial',esc(s.matriz))}${kv('Razão social',esc(s.razao))}${kv('CNPJ',esc(s.cnpj))}
 ${s.cnpj?'':'<div class="muted" style="margin-top:6px">Sem CNPJ na nossa base (achada só no Google). Se puder, peça o CNPJ ou a razão social.</div>'}</div>
 <div class="sec"><h3>Região</h3>${kv('Renda média do entorno',s.renda?'R$ '+fmt(s.renda):'')}${kv('Faixa de renda',esc(s.faixa))}
 ${kv('Outras pizzarias a até 1 km',fmt(s.viz))}${kv('…delas com movimento alto',fmt(s.viz_alto))}${kv('Distância até a Senhor Caixa',s.dsc.toLocaleString('pt-BR')+' km')}
 ${s.conc&&s.conc.length?'<div class="muted" style="margin-top:8px">Fornecedores de embalagem mais próximos:</div>'+s.conc.map(c=>kv(esc(c.nome),c.km.toLocaleString('pt-BR')+' km · '+esc(c.tipo))).join(''):''}</div>
 ${tips.length?`<div class="sec"><h3>Dicas para a abordagem</h3>${tips.map(t=>`<div class="tip">${t}</div>`).join('')}</div>`:''}`,
 `<a class="btn nav" href="${navUrl(s)}" target="_blank" rel="noopener">▶ Navegar</a><button class="btn pri" data-a="form" data-id="${s.id}">${r?'Editar visita':'Registrar visita'}</button>`)}

const F=[{sec:'Resultado'},{k:'resultado',l:'Como foi a visita? *',t:'one',o:RES.map(x=>x[0])},
 {sec:'Com quem falou'},{k:'contato_nome',l:'Nome',t:'text'},{k:'contato_cargo',l:'Cargo',t:'one',o:['Dono','Gerente','Comprador','Funcionário']},{k:'contato_tel',l:'Telefone / WhatsApp do decisor',t:'tel'},{k:'melhor_horario',l:'Melhor dia e horário para falar com o decisor',t:'text'},
 {sec:'Caixas que usa hoje'},{k:'fornecedor',l:'Fornecedor atual',t:'text',p:'Nome da empresa ou do vendedor'},
 {k:'caixa_tipo',l:'Tipo de caixa',t:'multi',o:['Parda lisa','Branca lisa','Impressa genérica','Personalizada (logo)']},{k:'caixa_formato',l:'Formato',t:'multi',o:['Quadrada','Oitavada']},
 {k:'tamanhos',l:'Tamanhos (cm)',t:'multi',o:['Broto 25','30','35','40','45','Outro']},
 {k:'consumo_qtd',l:'Quantas caixas usa?',t:'num',p:'Ex.: 500'},{k:'consumo_periodo',l:'Por',t:'one',o:['Semana','Mês']},
 {k:'precos',l:'Preço que paga hoje, por caixa (R$)',t:'prices',o:[['preco_broto','Broto'],['preco_30','30 cm'],['preco_35','35 cm'],['preco_40','40 cm'],['preco_outro','Outro']]},{k:'preco',l:'Observação sobre preço',t:'text',p:'Ex.: preço com frete, desconto por volume'},{k:'compra_freq',l:'Com que frequência compra',t:'one',o:['Semanal','Quinzenal','Mensal','Quando acaba']},{k:'pagamento',l:'Forma e prazo de pagamento',t:'text',p:'Ex.: boleto 28 dias, Pix à vista'},
 {k:'satisfacao',l:'Satisfação com o fornecedor atual (1 ruim – 5 ótimo)',t:'one',o:['1','2','3','4','5']},{k:'reclamacao',l:'Principal reclamação ou o que gostaria de melhorar',t:'text'},
 {k:'outras_embalagens',l:'Outras embalagens que compra',t:'text',p:'Ex.: caixa de esfiha, hambúrguer, sacolas'},{k:'outras_medidas',l:'Medidas dessas outras caixas',t:'text',p:'Ex.: esfiha 15x15, 20x20, altura 5 cm'},{k:'delivery',l:'Delivery',t:'multi',o:['iFood','Próprio (WhatsApp/telefone)','Outros apps','Não faz']},
 {sec:'Interesse e próximo passo'},{k:'interesse',l:'Interesse',t:'multi',o:['Quer amostra','Quer orçamento','Interesse em personalizada','Sem interesse agora']},
 {k:'proximo',l:'Próximo passo',t:'one',o:['Enviar orçamento','Levar amostra','Ligar','Voltar outro dia','Nenhum']},{k:'retorno_data',l:'Data combinada para o retorno',t:'date'},
 {k:'obs',l:'Observações',t:'area',p:'Qualquer coisa útil: movimento, estoque de caixas à vista, concorrente citado…'}];
function openForm(id){const[s]=find(id);if(!s)return;const v=ST[id]||{};let h='',open=false;
 F.forEach(f=>{if(f.sec){h+=(open?'</div>':'')+`<div class="sec"><h3>${f.sec}</h3>`;open=true;return}
  h+=`<label>${f.l}</label>`;const val=v[f.k];
  if(f.t==='one'||f.t==='multi')h+=`<div class="chips" data-k="${f.k}" data-m="${f.t==='multi'?1:0}">`+f.o.map(o=>`<button type="button" class="chip ${(f.t==='multi'?(val||[]).includes(o):val===o)?'on':''}">${esc(o)}</button>`).join('')+'</div>';
  else if(f.t==='prices')h+='<div class="pg">'+f.o.map(([k,t])=>`<div><span>${t}</span><input data-k="${k}" type="text" inputmode="decimal" placeholder="0,00" value="${esc(v[k]||'')}"></div>`).join('')+'</div>';
  else if(f.t==='area')h+=`<textarea data-k="${f.k}" placeholder="${esc(f.p||'')}">${esc(val||'')}</textarea>`;
  else h+=`<input data-k="${f.k}" type="${f.t==='num'?'number':f.t}" ${f.t==='num'?'inputmode="numeric"':''} placeholder="${esc(f.p||'')}" value="${esc(val||'')}">`;});
 h+='</div>'+(ST[id]?`<div class="row"><button class="btn dng" data-a="del" data-id="${id}">Apagar este registro</button></div>`:'');
 openSheet('Visita: '+s.nome,h,`<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="save" data-id="${id}">Salvar visita</button>`)}
function saveForm(id){const v={};document.querySelectorAll('#sb [data-k]').forEach(el=>{const k=el.dataset.k;
  if(el.classList.contains('chips')){const on=[...el.querySelectorAll('.chip.on')].map(c=>c.textContent);if(el.dataset.m==='1'){if(on.length)v[k]=on}else if(on[0])v[k]=on[0]}
  else if(el.value.trim())v[k]=el.value.trim()});
 if(!v.resultado){toast('Escolha como foi a visita (Resultado)');const c=document.querySelector('#sb [data-k=resultado]');if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.style.outline='2px solid #b91c1c';c.style.borderRadius='10px'}return}
 v.quando=(ST[id]&&ST[id].quando)||new Date().toISOString();v.atualizado=new Date().toISOString();if(me)v.gps=[+me[0].toFixed(5),+me[1].toFixed(5)];
 ST[id]=v;persist();closeSheet();render(false);toast('Visita salva ✔')}

/* envio */
let scope='dia';
const vend=()=>{try{return localStorage.getItem('sc_vendedor')||'Jadir'}catch(e){return'Jadir'}};
function recs(){const out=[];DATA.dias.forEach((d,i)=>{if(scope==='dia'&&i!==day)return;d.stops.forEach(s=>{if(ST[s.id])out.push(Object.assign({id:s.id,cnpj:s.cnpj,nome:s.nome,endereco:s.end,dia:d.nome,ordem:s.ordem},ST[s.id]))})});return out}
function texto(){const r=recs(),d=DATA.dias[day],tot=scope==='dia'?d.stops.length:DATA.dias.reduce((a,x)=>a+x.stops.length,0);
 const L=['*Senhor Caixa – Relatório de visitas*',DATA.semana+(scope==='dia'?' · '+d.nome:' · semana toda'),'Vendedor: '+(vend()||'–'),'Registradas: '+r.length+' de '+tot,''];
 const j=a=>Array.isArray(a)?a.join(', '):a;
 r.forEach(x=>{L.push('*'+x.ordem+') '+x.nome+'* ('+x.dia+')');const add=(k,v)=>{if(v)L.push(k+': '+j(v))};
  add('Resultado',x.resultado);add('Contato',[x.contato_nome,x.contato_cargo,x.contato_tel].filter(Boolean).join(' · '));add('Melhor horário',x.melhor_horario);add('Fornecedor atual',x.fornecedor);
  add('Caixa',[j(x.caixa_tipo),j(x.caixa_formato)].filter(Boolean).join(' · '));add('Tamanhos',x.tamanhos);add('Consumo',x.consumo_qtd?x.consumo_qtd+' caixas por '+(x.consumo_periodo||'?').toLowerCase():'');
  add('Preço por caixa',['broto','30','35','40','outro'].filter(k=>x['preco_'+k]).map(k=>(k==='broto'?'Broto':k==='outro'?'Outro':k+' cm')+' R$ '+x['preco_'+k]).join(' · '));add('Obs. preço',x.preco);add('Compra',x.compra_freq);add('Pagamento',x.pagamento);add('Satisfação (1–5)',x.satisfacao);add('Reclamação',x.reclamacao);add('Outras embalagens',x.outras_embalagens);add('Medidas',x.outras_medidas);add('Delivery',x.delivery);
  add('Interesse',x.interesse);add('Próximo passo',x.proximo);add('Retorno em',x.retorno_data?x.retorno_data.split('-').reverse().join('/'):'');add('Obs',x.obs);L.push('')});
 return L.join('\n')}
const pacote=()=>({app:'senhor-caixa-visitas',versao:1,semana:DATA.semana,semana_id:DATA.semana_id,vendedor:vend(),exportado_em:new Date().toISOString(),visitas:recs()});
const arqNome=()=>'visitas_'+DATA.semana_id+'_'+(scope==='dia'?DATA.dias[day].curto.replace(/\W+/g,'-'):'semana')+'.json';
function openEnv(){const n=recs().length;openSheet('Enviar relatório',`
 <div class="sec"><h3>Quem está enviando</h3><input id="vd" type="text" placeholder="Seu nome" value="${esc(vend())}"></div>
 <div class="sec"><h3>O que enviar</h3><div class="chips" id="sc"><button type="button" class="chip ${scope==='dia'?'on':''}" data-s="dia">Só ${esc(DATA.dias[day].curto)}</button><button type="button" class="chip ${scope==='tudo'?'on':''}" data-s="tudo">Semana toda</button></div>
 <p class="muted" id="cnt">${n} visita(s) registrada(s) nesta seleção.</p></div>
 <div class="sec"><h3>Enviar</h3><div class="row"><button class="btn pri" data-a="zap">Enviar pelo WhatsApp</button></div>
 <div class="row"><button class="btn" data-a="arq">Enviar / baixar arquivo</button><button class="btn" data-a="cop">Copiar texto</button></div>
 <p class="muted">O WhatsApp abre com o relatório pronto: escolha o contato do responsável e envie. O arquivo (.json) serve para atualizar a planilha e o mapa automaticamente.</p></div>
 <div class="sec"><h3>Prévia</h3><pre id="pv" style="white-space:pre-wrap;font:13px/1.4 system-ui;margin:0">${esc(texto())}</pre></div>`,`<button class="btn" data-a="close">Fechar</button>`)}
const refreshEnv=()=>{$('#pv').textContent=texto();$('#cnt').textContent=recs().length+' visita(s) registrada(s) nesta seleção.'};
const openLink=u=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()};
async function enviarZap(){if(!recs().length){toast('Nenhuma visita registrada');return}const t=texto();
 try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
 openLink('https://wa.me/?text='+encodeURIComponent(t))}
async function enviarArq(){if(!recs().length){toast('Nenhuma visita registrada');return}const blob=new Blob([JSON.stringify(pacote(),null,1)],{type:'application/json'});
 try{const f=new File([blob],arqNome(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Relatório de visitas'});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=arqNome();document.body.appendChild(a);a.click();a.remove();toast('Arquivo baixado')}
async function copiar(){try{await navigator.clipboard.writeText(texto());toast('Texto copiado')}catch(e){const r=document.createRange();r.selectNode($('#pv'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selecione e copie o texto da prévia')}}

/* eventos */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-a]');if(!t)return;
 if(t.parentElement&&t.parentElement.id==='tabs'){day=+t.dataset.i;try{localStorage.setItem(KEY+'_day',day)}catch(_){}render(true);return}
 if(t.classList.contains('chip')){const g=t.parentElement;if(g.id==='sc'){scope=t.dataset.s;g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t));refreshEnv();return}
  if(g.dataset.m==='1')t.classList.toggle('on');else{const was=t.classList.contains('on');g.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));if(!was)t.classList.add('on')}return}
 const a=t.dataset.a,id=t.dataset.id;
 if(t.id==='sx'||a==='close')closeSheet();else if(t.id==='bEnv'||a==='env')openEnv();else if(a==='ficha')openFicha(id);else if(a==='form')openForm(id);else if(a==='save')saveForm(id);
 else if(a==='del'){if(t.dataset.c){delete ST[id];persist();closeSheet();render(false);toast('Registro apagado')}else{t.dataset.c=1;t.textContent='Toque de novo para apagar'}}
 else if(a==='zap')enviarZap();else if(a==='arq')enviarArq();else if(a==='cop')copiar();});
document.addEventListener('input',e=>{if(e.target.id==='vd'){try{localStorage.setItem('sc_vendedor',e.target.value.trim())}catch(_){}refreshEnv()}});
function init(d){DATA=d;KEY='sc_visitas_'+DATA.semana_id;try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
 try{day=Math.min(+localStorage.getItem(KEY+'_day')||0,DATA.dias.length-1)}catch(e){}
 $('#lock').style.display='none';$('#sem').textContent=DATA.semana+' · '+vend();if(map)map.invalidateSize();render(true);gps()}
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function dec(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},k,b64(ENC.c))))}
async function entrar(pw,silencioso){pw=String(pw||'').trim().toLowerCase();if(!pw)return;const m=$('#lmsg');
 if(!(window.crypto&&crypto.subtle)){m.textContent='Abra esta página pelo link https enviado, no Chrome ou no Safari.';return}
 if(!silencioso)m.textContent='Abrindo…';
 try{const d=await dec(pw);try{localStorage.setItem('sc_pw',pw)}catch(e){}init(d)}catch(e){try{localStorage.removeItem('sc_pw')}catch(_){}m.textContent=silencioso?'':'Senha incorreta. Tente de novo.'}}
$('#lform').addEventListener('submit',e=>{e.preventDefault();entrar($('#lpw').value)});
(()=>{let p='';try{p=localStorage.getItem('sc_pw')||''}catch(e){}if(p)entrar(p,true)})();
</script></body></html>
