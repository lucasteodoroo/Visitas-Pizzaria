<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0b6e4f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Senhor Caixa – Visitas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3f4f6;color:#111;font-size:16px}
body{padding-bottom:64px}
header{background:#0b6e4f;color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:17px}header small{display:block;opacity:.85;font-size:12px}
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:3000}
#nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:13px;font-weight:600;color:#666}
#nav button span{display:block;font-size:20px;line-height:24px}#nav button.on{color:#0b6e4f}
.bar{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#fff;border-bottom:1px solid #e5e7eb;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid #cbd5e1;background:#fff;border-radius:99px;padding:8px 12px;font-size:14px;font-weight:600;color:#333;text-align:center}
.pill small{display:block;font-weight:400;font-size:11px;color:#666}.pill.on{background:#0b6e4f;border-color:#0b6e4f;color:#fff}.pill.on small{color:#d1fae5}
#map{height:32vh;min-height:190px;max-height:300px;background:#e5e7eb}
.hint{margin:10px 10px 0;font-size:13px;color:#555}
#next{margin:10px;padding:12px;background:#fff;border-radius:12px;border-left:6px solid #0b6e4f;box-shadow:0 1px 3px #0002}
#next .t{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.04em}#next .n{font-size:18px;font-weight:700;margin:2px 0}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{flex:1;min-width:88px;text-align:center;text-decoration:none;border:1px solid #cbd5e1;background:#fff;color:#111;border-radius:10px;padding:11px 8px;font-size:15px;font-weight:600}
.btn.pri{background:#0b6e4f;border-color:#0b6e4f;color:#fff}.btn.nav{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.btn.dng{color:#b91c1c;border-color:#fca5a5}
.card{margin:8px 10px;padding:10px;background:#fff;border-radius:12px;box-shadow:0 1px 3px #0002}
.card .top{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;background:#64748b;font-size:14px}
.cli{background:#2563eb!important}.ok{background:#16a34a!important}.volta{background:#d97706!important}.no{background:#b91c1c!important}
.card b{font-size:16px;display:block}.card .sub{font-size:13px;color:#555}
.badge{display:inline-block;margin:4px 4px 0 0;font-size:12px;padding:2px 8px;border-radius:99px;color:#fff;background:#64748b}
.tag{display:inline-block;margin:4px 4px 0 0;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef2ff;color:#3730a3}
#q{width:calc(100% - 20px);margin:10px 10px 0;padding:11px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px}
#sheet{position:fixed;inset:0;background:#f3f4f6;z-index:5000;display:none;flex-direction:column}#sheet.on{display:flex}
#sheet .sh{background:#0b6e4f;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#sheet .sh b{font-size:16px;line-height:1.2}#sheet .sh button{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:0 6px}
#sb{overflow:auto;padding:10px 10px 90px;flex:1}
.sec{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.sec h3{margin:0 0 8px;font-size:13px;color:#0b6e4f;text-transform:uppercase;letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #f1f1f1;font-size:15px}.kv:last-child{border:0}
.kv span:first-child{color:#666;min-width:0;overflow-wrap:anywhere}.kv span:last-child{text-align:right;font-weight:600;max-width:62%;overflow-wrap:anywhere;white-space:pre-line}
.tip{background:#ecfdf5;border-left:4px solid #0b6e4f;padding:9px 10px;border-radius:6px;font-size:15px;margin-top:6px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=password],input[type=tel],input[type=number],input[type=date],textarea{width:100%;padding:11px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-family:inherit}
textarea{min-height:80px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.pg span{display:block;font-size:13px;color:#555;margin-bottom:3px}.pg input{padding:9px!important}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:99px;padding:9px 13px;font-size:15px;color:#111}
.chip.on{background:#0b6e4f;border-color:#0b6e4f;color:#fff}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px;display:flex;gap:8px;z-index:5001}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:9999;display:none}
.muted{color:#666;font-size:13px}a{color:#1d4ed8}
.pin{border:2px solid #fff;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;color:#fff;font:700 12px system-ui;box-shadow:0 1px 4px #0007;background:#64748b}
.pin.sm{width:18px;height:18px;line-height:14px;font-size:0}
#lock{position:fixed;inset:0;background:#0b6e4f;z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px}
#lform{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:340px}#lform b{font-size:18px}#lform p{font-size:14px;color:#555}#lform input{margin-bottom:10px}#lform .btn{width:100%}
#lmsg{color:#b91c1c!important;min-height:18px;margin:8px 0 0}
</style></head><body>

const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n||n===0)?Number(n).toLocaleString('pt-BR'):'–';
const J=a=>Array.isArray(a)?a.join(', '):(a||'');
const KEY='sc_visitas';let ST={},view='ag',wk=0,day=0,filt='todas',me=null;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2400)};
const RES=[['Já é cliente Senhor Caixa','cli'],['Conversei com o decisor','ok'],['Conversei com funcionário','ok'],['Decisor ausente – voltar','volta'],['Estava fechado – voltar','volta'],['Não quis atender','no'],['Não existe / não é pizzaria','no']];
const HCLS={'Já é cliente':'cli','Oportunidade':'ok','Interesse a confirmar':'ok','Contato feito':'ok','Voltar':'volta','Sem interesse agora':'no','Sem interesse':'no'};
/* situação de cada pizzaria: registro neste celular > visita já enviada > pendente */
function stat(id){const r=ST[id];if(r){const f=RES.find(x=>x[0]===r.resultado);return{cls:f?f[1]:'ok',lbl:r.resultado||'Registrada',feita:true,src:'cel'}}
 const h=DATA.hist[id];if(h)return{cls:HCLS[h.situacao]||'ok',lbl:h.situacao,feita:h.situacao!=='Voltar',src:'hist'};return{cls:'',lbl:'Pendente',feita:false}}
const dist=(a,b)=>{const R=6371,r=Math.PI/180,dp=(b[0]-a[0])*r,dl=(b[1]-a[1])*r;const h=Math.sin(dp/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const kmTxt=p=>me?dist(me,[p.lat,p.lon]).toLocaleString('pt-BR',{maximumFractionDigits:1})+' km daqui':'';
const navUrl=p=>'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(p.end||(p.lat+','+p.lon));
const placeUrl=p=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.nome+', '+p.end);
const semNome=id=>{const i=DATA.semanas.findIndex(s=>s.id===id);return 'Sem. '+(i+1)};
const agTxt=p=>(p.agenda||[]).map(a=>semNome(a.sem)+' · '+a.dia).join(' | ');
const loc=p=>esc(p.bairro)+(p.mun&&p.mun!=='São Paulo'?' – '+esc(p.mun):'');

/* mapa */
let map=null,grp=null,meMk=null;
try{map=L.map('map',{zoomControl:false});L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri, © OpenStreetMap'}).addTo(map);
 L.control.zoom({position:'bottomright'}).addTo(map);grp=L.layerGroup().addTo(map)}catch(e){map=null}
function drawMap(ids,numbered){if(!map)return;grp.clearLayers();const pts=[];
 if(numbered&&ids.length>1)L.polyline(ids.map(i=>[DATA.p[i].lat,DATA.p[i].lon]),{color:'#0b6e4f',weight:3,opacity:.5,dashArray:'6 6'}).addTo(grp);
 ids.forEach((i,k)=>{const p=DATA.p[i];pts.push([p.lat,p.lon]);
  L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<div class="pin ${stat(i).cls}">${numbered?k+1:''}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).bindTooltip(esc(p.nome),{direction:'top',offset:[0,-12]}).on('click',()=>openFicha(i)).addTo(grp)});
 if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:15})}
function gps(){if(!navigator.geolocation)return;try{navigator.geolocation.watchPosition(p=>{const first=!me;me=[p.coords.latitude,p.coords.longitude];
 if(map){if(!meMk)meMk=L.circleMarker(me,{radius:8,color:'#fff',weight:3,fillColor:'#1d4ed8',fillOpacity:1}).addTo(map);else meMk.setLatLng(me)}
 if(view==='ag')renderNext();else if(first||filt==='perto')renderPz(false)},()=>{},{enableHighAccuracy:true,maximumAge:15000,timeout:20000})}catch(e){}}

/* cartão de pizzaria */
const card=(i,n)=>{const p=DATA.p[i],s=stat(i);return `<div class="card"><div class="top"><div class="num ${s.cls}">${n??'•'}</div><div style="flex:1">
 <b>${esc(p.nome)}</b><div class="sub">${loc(p)} · ★ ${p.nota||'–'} (${fmt(p.av)})${me?' · '+kmTxt(p):''}</div>
 <span class="badge ${s.cls}">${esc(s.lbl)}${s.src==='hist'?' (já enviada)':''}</span>${view==='pz'&&p.agenda?p.agenda.map(a=>`<span class="tag">${semNome(a.sem)} · ${esc(a.dia)}</span>`).join(''):''}</div></div>
 <div class="row"><a class="btn nav" href="${navUrl(p)}" target="_blank" rel="noopener">Navegar</a><button class="btn" data-a="ficha" data-id="${i}">Ficha</button><button class="btn pri" data-a="form" data-id="${i}">${ST[i]?'Editar':'Registrar'}</button></div></div>`};

/* aba Agenda */
function renderAg(fit){const W=DATA.semanas[wk];day=Math.min(day,W.dias.length-1);
 $('#wbar').innerHTML=DATA.semanas.map((s,k)=>`<button class="pill ${k===wk?'on':''}" data-w="${k}">${esc(s.nome.split(' (')[0])}${s.id===DATA.atual?' (atual)':''}<small>${esc((s.nome.match(/\((.*)\)/)||[,''])[1])}</small></button>`).join('');
 $('#dbar').innerHTML=W.dias.map((d,k)=>{const f=d.ids.filter(i=>stat(i).feita).length;return `<button class="pill ${k===day?'on':''}" data-d="${k}">${esc(d.curto)}<small>${f}/${d.ids.length} feitas</small></button>`}).join('');
 renderNext();const d=W.dias[day];
 $('#list').innerHTML=d.ids.map((i,k)=>card(i,k+1)).join('')+'<p class="muted" style="text-align:center;padding:8px 14px 20px">A agenda é uma sugestão. Qualquer pizzaria pode ser visitada em qualquer dia — veja todas na aba <b>Pizzarias</b>.</p>';
 drawMap(d.ids,true)}
function renderNext(){const W=DATA.semanas[wk],d=W.dias[day];const i=d.ids.find(x=>!stat(x).feita);const el=$('#next');
 if(!i){el.innerHTML=`<div class="t">${esc(d.nome)}</div><div class="n">Todas as visitas deste dia estão feitas ✔</div><div class="row"><button class="btn pri" data-a="env">Enviar relatório</button></div>`;return}
 const p=DATA.p[i];el.innerHTML=`<div class="t">Próxima sugerida · ${esc(d.nome)}</div><div class="n">${d.ids.indexOf(i)+1}. ${esc(p.nome)}</div><div class="muted">${loc(p)}${me?' · '+kmTxt(p):''}</div>
 <div class="row"><a class="btn nav" href="${navUrl(p)}" target="_blank" rel="noopener">▶ Navegar (GPS)</a><button class="btn" data-a="ficha" data-id="${i}">Ficha</button><button class="btn pri" data-a="form" data-id="${i}">Registrar</button></div>`}

/* aba Pizzarias */
const FIL=[['todas','Todas'],['pend','Pendentes'],['feitas','Visitadas'],['cli','Já clientes'],['op','Oportunidades'],['perto','Mais perto de mim']];
function lista(){const t=(($('#q').value||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()).trim();
 let ids=Object.keys(DATA.p).filter(i=>{const p=DATA.p[i],s=stat(i);
  if(t&&!(p.nome+' '+p.bairro+' '+p.mun+' '+(p.razao||'')).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().includes(t))return false;
  if(filt==='pend')return !s.feita;if(filt==='feitas')return s.feita;if(filt==='cli')return s.cls==='cli';
  if(filt==='op'){const h=ST[i]||DATA.hist[i]||{};return ['Quer amostra','Quer orçamento','Interesse em personalizada'].some(x=>(h.interesse||[]).includes(x))}return true});
 if(filt==='perto'&&me)ids.sort((a,b)=>dist(me,[DATA.p[a].lat,DATA.p[a].lon])-dist(me,[DATA.p[b].lat,DATA.p[b].lon]));
 else ids.sort((a,b)=>(stat(a).feita-stat(b).feita)||DATA.p[a].nome.localeCompare(DATA.p[b].nome,'pt'));return ids}
function renderPz(){$('#fbar').innerHTML=FIL.map(([k,t])=>`<button class="pill ${k===filt?'on':''}" data-f="${k}">${t}</button>`).join('');
 const ids=lista(),all=Object.keys(DATA.p),f=all.filter(i=>stat(i).feita).length;
 $('#pzinfo').textContent=`${ids.length} de ${all.length} pizzarias · ${f} visitadas · ${all.length-f} pendentes`+(filt==='perto'&&!me?' · ative a localização para ordenar por distância':'');
 $('#plist').innerHTML=ids.map(i=>card(i)).join('')||'<p class="muted" style="padding:14px">Nenhuma pizzaria encontrada.</p>'}

function show(v){view=v;$('#vAg').style.display=v==='ag'?'':'none';$('#vPz').style.display=v==='pz'?'':'none';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='pz'){$('#vPz').prepend($('#map'));renderPz();drawMap(lista(),false)}else{$('#vAg').insertBefore($('#map'),$('#next'));renderAg()}
 if(map)setTimeout(()=>map.invalidateSize(),50);window.scrollTo(0,0)}
const render=()=>{if(view==='pz'){renderPz();drawMap(lista(),false)}else renderAg()};

/* folha: ficha / formulário / envio */
const openSheet=(t,body,foot)=>{$('#st').textContent=t;$('#sb').innerHTML=body;$('#sf').innerHTML=foot||'';$('#sheet').classList.add('on');$('#sb').scrollTop=0};

const visitaHtml=(x,tit)=>`<div class="sec"><h3>${tit}</h3>${kv('Situação',esc(x.situacao||x.resultado))}${kv('Resultado',x.situacao?esc(x.resultado):'')}${kv('Quando',esc(x.data_visita||(x.quando?new Date(x.quando).toLocaleDateString('pt-BR'):'')))}
 ${kv('Contato',esc([x.contato_nome,x.contato_cargo,x.contato_tel].filter(Boolean).join(' · ')))}${kv('Melhor horário',esc(x.melhor_horario))}${kv('Fornecedor atual',esc(x.fornecedor))}
 ${kv('Caixa',esc([J(x.caixa_tipo),J(x.caixa_formato)].filter(Boolean).join(' · ')))}${kv('Tamanhos',esc(J(x.tamanhos)))}${kv('Consumo',x.consumo_qtd?esc(x.consumo_qtd+' por '+(x.consumo_periodo||'?').toLowerCase()):'')}
 ${kv('Preço por caixa',esc(precos(x)))}${kv('Preço',esc(x.preco))}${kv('Compra',esc(x.compra_freq))}${kv('Pagamento',esc(x.pagamento))}${kv('Outras embalagens',esc(x.outras_embalagens))}${kv('Medidas',esc(x.outras_medidas))}
 ${kv('Delivery',esc(J(x.delivery)))}${kv('Interesse',esc(J(x.interesse)))}${kv('Próximo passo',esc(x.proximo))}${kv('Observações',esc(x.obs))}</div>`;
function openFicha(id){const p=DATA.p[id];if(!p)return;const tel=t=>t?`<a href="tel:${t.replace(/\D/g,'')}">${esc(t)}</a>`:'';
 const vol=p.av>=1000?'Alto':p.av>=200?'Médio':p.av>=30?'Baixo':'Muito baixo';const tips=[];
 if(p.faixa==='Alta')tips.push('Entorno de <b>renda alta</b>: apresente a <b>caixa personalizada</b> (logo, papelão mais firme, boa impressão).');
 else if(p.faixa==='Média-alta')tips.push('Entorno de renda média-alta: mostre as duas linhas, <b>padrão e personalizada</b>.');
 else if(p.faixa)tips.push('Região mais sensível a preço: foque em <b>preço por caixa</b>, prazo e regularidade de entrega.');
 if(p.av>=1000)tips.push('Movimento <b>alto</b> pelo Google: provável compra grande e recorrente. Tente falar com o dono ou o comprador.');
 if(p.rede)tips.push('Parece fazer parte de uma <b>rede</b>: pergunte quem centraliza a compra de embalagens.');
 if(p.conc&&p.conc[0]&&p.conc[0].km<=1.5)tips.push('Há fornecedor de embalagem a '+p.conc[0].km.toLocaleString('pt-BR')+' km: pergunte de quem compram e o que falta no atendimento atual.');
 const r=ST[id],h=DATA.hist[id];
 openSheet(p.nome,`${r?visitaHtml(r,'Registrada neste celular'+(r._enviado&&r.atualizado<=r._enviado?' (já enviada)':' (ainda não enviada)')):''}${h?visitaHtml(h,'Visita anterior (já recebida)'):''}
 <div class="sec"><h3>Contato</h3><div style="font-size:15px;margin-bottom:6px">${esc(p.end)}</div>${kv('Telefone',tel(p.tel))}${kv('Telefone 2',tel(p.tel2))}${kv('E-mail cadastrado',esc(p.email))}
 ${p.link?kv(p.link.includes('instagram')?'Instagram':'Site',`<a href="${esc(p.link)}" target="_blank" rel="noopener">abrir</a>`):''}${kv('Google Maps',`<a href="${placeUrl(p)}" target="_blank" rel="noopener">ver fotos e horário</a>`)}${kv('Na agenda',esc(agTxt(p)))}</div>
 <div class="sec"><h3>Perfil da pizzaria</h3>${kv('Nota no Google',p.nota?p.nota+' ★':'')}${kv('Avaliações',fmt(p.av))}${kv('Movimento estimado',vol)}${kv('Tipo',esc(p.ativ))}${kv('Tempo de atividade',p.anos?fmt(p.anos)+' anos':'')}
 ${kv('Porte',esc(p.porte))}${kv('Matriz/filial',esc(p.matriz))}${kv('Razão social',esc(p.razao))}${kv('CNPJ',esc(p.cnpj))}${p.cnpj?'':'<div class="muted" style="margin-top:6px">Sem CNPJ na nossa base. Se puder, peça o CNPJ ou a razão social.</div>'}</div>
 <div class="sec"><h3>Região</h3>${kv('Renda média do entorno',p.renda?'R$ '+fmt(p.renda):'')}${kv('Faixa de renda',esc(p.faixa))}${kv('Outras pizzarias a até 1 km',fmt(p.viz))}${kv('…delas com movimento alto',fmt(p.viz_alto))}
 ${kv('Distância até a Senhor Caixa',p.dsc.toLocaleString('pt-BR')+' km')}${p.conc&&p.conc.length?'<div class="muted" style="margin-top:8px">Fornecedores de embalagem mais próximos:</div>'+p.conc.map(c=>kv(esc(c.nome),c.km.toLocaleString('pt-BR')+' km · '+esc(c.tipo))).join(''):''}</div>
 ${tips.length?`<div class="sec"><h3>Dicas para a abordagem</h3>${tips.map(t=>`<div class="tip">${t}</div>`).join('')}</div>`:''}`,
 `<a class="btn nav" href="${navUrl(p)}" target="_blank" rel="noopener">▶ Navegar</a><button class="btn pri" data-a="form" data-id="${id}">${r?'Editar visita':'Registrar visita'}</button>`)}

const F=[{sec:'Resultado'},{k:'resultado',l:'Como foi a visita? *',t:'one',o:RES.map(x=>x[0])},
 {sec:'Com quem falou'},{k:'contato_nome',l:'Nome',t:'text'},{k:'contato_cargo',l:'Cargo',t:'one',o:['Dono','Gerente','Comprador','Funcionário']},{k:'contato_tel',l:'Telefone / WhatsApp do decisor',t:'tel'},{k:'melhor_horario',l:'Melhor dia e horário para falar com o decisor',t:'text'},
 {sec:'Caixas que usa hoje'},{k:'fornecedor',l:'Fornecedor atual',t:'text',p:'Nome da empresa ou do vendedor'},
 {k:'caixa_tipo',l:'Tipo de caixa',t:'multi',o:['Parda lisa','Branca lisa','Impressa genérica','Personalizada (logo)']},{k:'caixa_formato',l:'Formato',t:'multi',o:['Quadrada','Oitavada']},
 {k:'tamanhos',l:'Tamanhos (cm)',t:'multi',o:['Broto 25','30','35','40','45','Outro']},
 {k:'consumo_qtd',l:'Quantas caixas usa?',t:'num',p:'Ex.: 500'},{k:'consumo_periodo',l:'Por',t:'one',o:['Semana','Mês']},
 {k:'precos',l:'Preço que paga hoje, por caixa (R$)',t:'prices',o:[['preco_broto','Broto'],['preco_30','30 cm'],['preco_35','35 cm'],['preco_40','40 cm'],['preco_outro','Outro']]},{k:'preco',l:'Observação sobre preço',t:'text',p:'Ex.: preço com frete, desconto por volume'},
 {k:'compra_freq',l:'Com que frequência compra',t:'one',o:['Semanal','Quinzenal','Mensal','Quando acaba']},{k:'pagamento',l:'Forma e prazo de pagamento',t:'text',p:'Ex.: boleto 28 dias, Pix à vista'},
 {k:'satisfacao',l:'Satisfação com o fornecedor atual (1 ruim – 5 ótimo)',t:'one',o:['1','2','3','4','5']},{k:'reclamacao',l:'Principal reclamação ou o que gostaria de melhorar',t:'text'},
 {k:'outras_embalagens',l:'Outras embalagens que compra',t:'text',p:'Ex.: caixa de esfiha, hambúrguer, sacolas'},{k:'outras_medidas',l:'Medidas dessas outras caixas',t:'text',p:'Ex.: esfiha 15x15, 20x20, altura 5 cm'},
 {k:'delivery',l:'Delivery',t:'multi',o:['iFood','Próprio (WhatsApp/telefone)','Outros apps','Não faz']},
 {sec:'Interesse e próximo passo'},{k:'interesse',l:'Interesse',t:'multi',o:['Quer amostra','Quer orçamento','Interesse em personalizada','Sem interesse agora']},
 {k:'proximo',l:'Próximo passo',t:'one',o:['Enviar orçamento','Levar amostra','Ligar','Voltar outro dia','Nenhum']},{k:'retorno_data',l:'Data combinada para o retorno',t:'date'},
 {k:'obs',l:'Observações',t:'area',p:'Qualquer coisa útil: movimento, estoque de caixas à vista, concorrente citado…'}];
function openForm(id){const p=DATA.p[id];if(!p)return;const v=ST[id]||{};let h='',open=false;
 F.forEach(f=>{if(f.sec){h+=(open?'</div>':'')+`<div class="sec"><h3>${f.sec}</h3>`;open=true;return}
  h+=`<label>${f.l}</label>`;const val=v[f.k];
  if(f.t==='one'||f.t==='multi')h+=`<div class="chips" data-k="${f.k}" data-m="${f.t==='multi'?1:0}">`+f.o.map(o=>`<button type="button" class="chip ${(f.t==='multi'?(val||[]).includes(o):val===o)?'on':''}">${esc(o)}</button>`).join('')+'</div>';
  else if(f.t==='prices')h+='<div class="pg">'+f.o.map(([k,t])=>`<div><span>${t}</span><input data-k="${k}" type="text" inputmode="decimal" placeholder="0,00" value="${esc(v[k]||'')}"></div>`).join('')+'</div>';
  else if(f.t==='area')h+=`<textarea data-k="${f.k}" placeholder="${esc(f.p||'')}">${esc(val||'')}</textarea>`;
  else h+=`<input data-k="${f.k}" type="${f.t==='num'?'number':f.t}" ${f.t==='num'?'inputmode="numeric"':''} placeholder="${esc(f.p||'')}" value="${esc(val||'')}">`});
 h+='</div>'+(ST[id]?`<div class="row"><button class="btn dng" data-a="del" data-id="${id}">Apagar este registro</button></div>`:'');
 openSheet('Visita: '+p.nome,h,`<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="save" data-id="${id}">Salvar visita</button>`)}
function saveForm(id){const v={};document.querySelectorAll('#sb [data-k]').forEach(el=>{const k=el.dataset.k;
  if(el.classList.contains('chips')){const on=[...el.querySelectorAll('.chip.on')].map(c=>c.textContent);if(el.dataset.m==='1'){if(on.length)v[k]=on}else if(on[0])v[k]=on[0]}
  else if(el.value.trim())v[k]=el.value.trim()});
 if(!v.resultado){toast('Escolha como foi a visita (Resultado)');const c=document.querySelector('#sb [data-k=resultado]');if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.style.outline='2px solid #b91c1c';c.style.borderRadius='10px'}return}
 const old=ST[id]||{};v.quando=old.quando||new Date().toISOString();v.atualizado=new Date().toISOString();if(old._enviado)v._enviado=old._enviado;
 if(me)v.gps=[+me[0].toFixed(5),+me[1].toFixed(5)];ST[id]=v;persist();closeSheet();render();toast('Visita salva ✔')}

/* envio */
let scope='nao';
const vend=()=>{try{return localStorage.getItem('sc_vendedor')||'Jadir'}catch(e){return'Jadir'}};
const naoEnviado=r=>!r._enviado||r.atualizado>r._enviado;
const hoje=r=>(r.atualizado||'').slice(0,10)===new Date().toISOString().slice(0,10);
function recs(){return Object.keys(ST).filter(i=>DATA.p[i]&&(scope==='todas'||(scope==='nao'&&naoEnviado(ST[i]))||(scope==='hoje'&&hoje(ST[i]))))
 .sort((a,b)=>(ST[a].quando||'').localeCompare(ST[b].quando||'')).map(i=>{const p=DATA.p[i],r=ST[i];const o={id:i,cnpj:p.cnpj,nome:p.nome,endereco:p.end,agenda:agTxt(p)};
  for(const k in r)if(k!=='_enviado')o[k]=r[k];return o})}
function texto(){const r=recs(),L=['*Senhor Caixa – Relatório de visitas*','Vendedor: '+vend(),'Enviado em '+new Date().toLocaleString('pt-BR'),'Visitas: '+r.length,''];
 r.forEach(x=>{L.push('*'+x.nome+'* ('+new Date(x.quando).toLocaleDateString('pt-BR')+')');const add=(k,v)=>{v=J(v);if(v)L.push(k+': '+v)};
  add('Resultado',x.resultado);add('Contato',[x.contato_nome,x.contato_cargo,x.contato_tel].filter(Boolean).join(' · '));add('Melhor horário',x.melhor_horario);add('Fornecedor atual',x.fornecedor);
  add('Caixa',[J(x.caixa_tipo),J(x.caixa_formato)].filter(Boolean).join(' · '));add('Tamanhos',x.tamanhos);add('Consumo',x.consumo_qtd?x.consumo_qtd+' caixas por '+(x.consumo_periodo||'?').toLowerCase():'');
  add('Preço por caixa',precos(x));add('Obs. preço',x.preco);add('Compra',x.compra_freq);add('Pagamento',x.pagamento);add('Satisfação (1–5)',x.satisfacao);add('Reclamação',x.reclamacao);
  add('Outras embalagens',x.outras_embalagens);add('Medidas',x.outras_medidas);add('Delivery',x.delivery);add('Interesse',x.interesse);add('Próximo passo',x.proximo);
  add('Retorno em',x.retorno_data?x.retorno_data.split('-').reverse().join('/'):'');add('Obs',x.obs);L.push('')});return L.join('\n')}
const pacote=()=>({app:'senhor-caixa-visitas',versao:2,vendedor:vend(),exportado_em:new Date().toISOString(),visitas:recs()});
const arqNome=()=>'visitas_'+new Date().toISOString().slice(0,10)+'.json';
const marcar=()=>{const t=new Date().toISOString();recs().forEach(x=>{ST[x.id]._enviado=t});persist()};
function openEnv(){openSheet('Enviar relatório',`
 <div class="sec"><h3>Quem está enviando</h3><input id="vd" type="text" placeholder="Seu nome" value="${esc(vend())}"></div>
 <div class="sec"><h3>O que enviar</h3><div class="chips" id="sc">${[['nao','Ainda não enviadas'],['hoje','Registradas hoje'],['todas','Todas deste celular']].map(([k,t])=>`<button type="button" class="chip ${scope===k?'on':''}" data-s="${k}">${t}</button>`).join('')}</div>
 <p class="muted" id="cnt"></p></div>
 <div class="sec"><h3>Enviar</h3><div class="row"><button class="btn pri" data-a="zap">Enviar pelo WhatsApp</button></div>
 <div class="row"><button class="btn" data-a="arq">Enviar / baixar arquivo</button><button class="btn" data-a="cop">Copiar texto</button></div>
 <p class="muted">Mande o texto <b>e</b> o arquivo. O arquivo atualiza a planilha e o mapa automaticamente. Depois de enviadas, as visitas saem da lista "Ainda não enviadas", mas continuam salvas aqui.</p></div>
 <div class="sec"><h3>Prévia</h3><pre id="pv" style="white-space:pre-wrap;font:13px/1.4 system-ui;margin:0"></pre></div>`,`<button class="btn" data-a="close">Fechar</button>`);refreshEnv()}
const refreshEnv=()=>{$('#pv').textContent=texto();$('#cnt').textContent=recs().length+' visita(s) nesta seleção.'};
const openLink=u=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()};
async function enviarZap(){if(!recs().length){toast('Nenhuma visita nesta seleção');return}const t=texto();
 try{if(navigator.share){await navigator.share({text:t});marcar();refreshEnv();return}}catch(e){if(e&&e.name==='AbortError')return}
 openLink('https://wa.me/?text='+encodeURIComponent(t));marcar();refreshEnv()}
async function enviarArq(){if(!recs().length){toast('Nenhuma visita nesta seleção');return}const blob=new Blob([JSON.stringify(pacote(),null,1)],{type:'application/json'});
 try{const f=new File([blob],arqNome(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Relatório de visitas'});marcar();refreshEnv();return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=arqNome();document.body.appendChild(a);a.click();a.remove();marcar();refreshEnv();toast('Arquivo baixado')}
async function copiar(){try{await navigator.clipboard.writeText(texto());toast('Texto copiado')}catch(e){const r=document.createRange();r.selectNode($('#pv'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selecione e copie o texto da prévia')}}

/* eventos */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-a]');if(!t)return;
 if(t.dataset.v){if(t.dataset.v==='env')openEnv();else show(t.dataset.v);return}
 if(t.dataset.w!==undefined){wk=+t.dataset.w;day=0;renderAg();return}
 if(t.dataset.d!==undefined){day=+t.dataset.d;try{localStorage.setItem('sc_day',wk+','+day)}catch(_){}renderAg();return}
 if(t.dataset.f){filt=t.dataset.f;renderPz();drawMap(lista(),false);return}
 if(t.classList.contains('chip')){const g=t.parentElement;if(g.id==='sc'){scope=t.dataset.s;g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t));refreshEnv();return}
  if(g.dataset.m==='1')t.classList.toggle('on');else{const was=t.classList.contains('on');g.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));if(!was)t.classList.add('on')}return}
 const a=t.dataset.a,id=t.dataset.id;
 if(t.id==='sx'||a==='close')closeSheet();else if(a==='env')openEnv();else if(a==='ficha')openFicha(id);else if(a==='form')openForm(id);else if(a==='save')saveForm(id);
 else if(a==='del'){if(t.dataset.c){delete ST[id];persist();closeSheet();render();toast('Registro apagado')}else{t.dataset.c=1;t.textContent='Toque de novo para apagar'}}
 else if(a==='zap')enviarZap();else if(a==='arq')enviarArq();else if(a==='cop')copiar()});
document.addEventListener('input',e=>{if(e.target.id==='vd'){try{localStorage.setItem('sc_vendedor',e.target.value.trim())}catch(_){}$('#sem').textContent='Vendedor: '+vend();refreshEnv()}
 if(e.target.id==='q'){renderPz();drawMap(lista(),false)}});

/* início: senha, dados e registros antigos */
function init(d){DATA=d;try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){ST={}}
 try{for(let k=0;k<localStorage.length;k++){const n=localStorage.key(k);if(!/^sc_visitas_/.test(n)||/_day$/.test(n))continue;   /* traz registros da versão anterior do app */
  const o=JSON.parse(localStorage.getItem(n)||'{}');for(const i in o)if(!ST[i]||(o[i].atualizado||'')>(ST[i].atualizado||''))ST[i]=o[i]}persist()}catch(e){}
 wk=Math.max(0,DATA.semanas.findIndex(s=>s.id===DATA.atual));try{const s=(localStorage.getItem('sc_day')||'').split(',');if(s.length===2&&DATA.semanas[+s[0]]){wk=+s[0];day=+s[1]}}catch(e){}
 $('#lock').style.display='none';$('#sem').textContent='Vendedor: '+vend();if(map)map.invalidateSize();show('ag');gps()}
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function dec(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},k,b64(ENC.c))))}
async function entrar(pw,silencioso){pw=String(pw||'').trim().toLowerCase();if(!pw)return;const m=$('#lmsg');
 if(!(window.crypto&&crypto.subtle)){m.textContent='Abra esta página pelo link https enviado, no Chrome ou no Safari.';return}
 if(!silencioso)m.textContent='Abrindo…';
 try{const d=await dec(pw);try{localStorage.setItem('sc_pw',pw)}catch(e){}init(d)}catch(e){try{localStorage.removeItem('sc_pw')}catch(_){}m.textContent=silencioso?'':'Senha incorreta. Tente de novo.'}}
$('#lform').addEventListener('submit',e=>{e.preventDefault();entrar($('#lpw').value)});
(()=>{let p='';try{p=localStorage.getItem('sc_pw')||''}catch(e){}if(p)entrar(p,true)})();
</script></body></html>
